<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Creator</title>
    <link rel="stylesheet" href="assets/css/reinvented-color-wheel.min.css">
    <link rel="stylesheet" href="assets/css/swatchman.css">
</head>
<body>
    <div class="container">
        <div class="color-picker-section">
            <div class="color-picker-container">
                <div class="main-controls">
                    <div class="history-controls">
                        <button type="button" id="undoButton" disabled>Undo</button>
                        <button type="button" id="redoButton" disabled>Redo</button>
                    </div>
                    <div class="file-controls">
                        <button type="button" id="saveButton">Save Image</button>
                        <button type="button" id="loadButton">Load Image</button>
                        <input type="file" id="loadInput" accept=".png,.bmp,.gif,image/png,image/bmp,image/gif" hidden>
                    </div>
                </div>
                <div id="colorWheel"><!-- Generated by the script --></div>
                
                <div class="hsb-inputs">
                    <div class="hsb-input-group">
                        <label>
                            <span>Hue</span>
                            <span class="range">(0-360)</span>
                        </label>
                        <input type="number" id="hueInput" min="0" max="360" step="1" value="0">
                    </div>
                    
                    <div class="hsb-input-group">
                        <label>
                            <span>Saturation</span>
                            <span class="range">(0-100)</span>
                        </label>
                        <input type="number" id="saturationInput" min="0" max="100" step="1" value="100">
                    </div>
                    
                    <div class="hsb-input-group">
                        <label>
                            <span>Brightness</span>
                            <span class="range">(0-100)</span>
                        </label>
                        <input type="number" id="brightnessInput" inputmode="numeric" min="0" max="100" step="1" value="100">
                    </div>
                </div>
            </div>
            
            <div class="swatch-section">
                <div class="swatch-count-controls">
                    <button type="button" id="removeSwatchButton" title="Remove color">-</button>
                    <button type="button" id="addSwatchButton" title="Add color">+</button>
                    <span class="ramp-controls">
                        <button type="button" id="rampButton" title="Set the hue of every other color in this row, stepping from the selected color">Hue Ramp</button>
                        <input type="number" id="rampInput" inputmode="numeric" min="0" max="180" step="1" value="20" title="Hue step in degrees (0-360)" aria-label="Hue step">
                        <label><input type="checkbox" id="rampResetSV"> Match S/B</label>
                    </span>
                    <span class="desaturate-controls">
                        <button type="button" id="desaturationFlip" title="Desaturated Flip">+Desaturate</button>
                        <input type="number" id="desaturationFactor" inputmode="numeric" min="0" max="1" value="0.5" step="0.01" title="Desaturation Percentage" aria-label="Desaturation Factor">
                    </span>
                </div>
                <div class="swatch-container" id="swatchContainer">
                    <!-- Swatch squares generated by script -->
                </div>
                <div class="add-row-controls">
                    <button type="button" id="addRowButton" title="Add row(s)">Add Row(s)</button>
                    <input type="number" id="numRows" inputmode="numeric" min="1" max="15" value="7" title="Num nows to add" aria-label="Number of rows">
                    <input type="number" id="hueShift" inputmode="numeric" min="0" max="180" value="45" title="Hue shift to apply to each row" aria-label="Hue shift">
                </div>
            </div>
        </div>
        <div>
            <p>This is a (semi-)vibe-coded app that aims to facilitate the process for palette creation described by <a href="https://www.slynyrd.com/blog/2018/1/10/pixelblog-1-color-palettes">this article by Raymond Schlitter</a>.</p>
        </div>
    </div>

    <div class="toast" id="toast" role="alert" hidden>
        <span id="toastMessage"></span>
        <button type="button" id="toastDismiss" aria-label="Dismiss">&times;</button>
    </div>

    <script src="assets/js/reinvented-color-wheel.min.js"></script>
    <script src="assets/js/swatchman.js"></script>
</body>
</html>
